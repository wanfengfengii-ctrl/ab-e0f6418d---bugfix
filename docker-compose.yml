services:
  api:
    build: .
    image: nanopore-align:latest
    environment:
      # 容器内监听端口（镜像固定暴露 8000，也可覆盖）。
      PORT: "8000"
    ports:
      # 宿主机端口可通过环境变量 NANOPORE_HOST_PORT 配置，默认 8080。
      - "${NANOPORE_HOST_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  verify:
    build: .
    image: nanopore-align:latest
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: "http://api:8000"
    entrypoint: ["python", "verify/verify.py"]
    # 清空镜像默认 CMD（API 启动命令），避免其作为参数传给 verify 脚本。
    command: []
    restart: "no"
